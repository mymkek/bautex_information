# Раздача собранного фронтенда. TLS и /api — во внешнем nginx.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Файлы с хешем в имени — кешируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: неизвестные пути отдаём в index.html (react-router)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
